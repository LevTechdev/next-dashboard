name: E2E (reusable)

# Single source of truth for the Playwright E2E job. Called by both
# .github/workflows/e2e.yml (every push/PR, all branches) and
# .github/workflows/ci.yml (main-push-only "release gate" wired into
# release.needs) — so the two runs can never drift apart.
#
# The caller passes the DB/secret values as inputs: reusable workflows cannot
# read the caller's `env`, and these are CI-only placeholders, not real
# secrets (real secrets would use the `secrets:` map instead).

on:
  workflow_call:
    # The sandbox gateway key is a real (test-mode) credential, so it travels
    # through the secrets map rather than inputs. Optional: when the repository
    # secret is absent the key is empty and the signed-webhook specs SKIP with
    # an explicit annotation (see e2e/midtrans-settlement-invoice.spec.ts)
    # instead of failing the suite for a missing fixture.
    secrets:
      midtrans-sandbox-server-key:
        required: false
    inputs:
      node-version:
        description: Node.js version
        required: false
        type: string
        default: "20"
      artifact-suffix:
        description: Suffix appended to uploaded artifact names (e.g. -gate)
        required: false
        type: string
        default: ""
      database-url:
        description: Postgres connection string for the test database
        required: true
        type: string
      jwt-secret:
        description: JWT signing secret placeholder for E2E
        required: true
        type: string
      nextauth-secret:
        description: NEXTAUTH_SECRET placeholder for E2E
        required: true
        type: string
      nextauth-url:
        description: NEXTAUTH_URL (the dev server runs on :3010)
        required: true
        type: string
      google-client-id:
        description: GOOGLE_CLIENT_ID placeholder for E2E
        required: true
        type: string
      google-client-secret:
        description: GOOGLE_CLIENT_SECRET placeholder for E2E
        required: true
        type: string
      run-quarantined:
        description: >-
          Run the FULL suite, including the tests exempted in
          e2e/quarantine.json (issue #7). Used by the weekly sweep workflow so
          quarantined tests keep being exercised; the blocking gate leaves this
          false and excludes them via --grep-invert.
        required: false
        type: boolean
        default: false

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: ${{ inputs.database-url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"
      - run: npm ci
      - name: Verify E2E suite stays at 232 tests
        # Pins the suite size so adding/removing a spec (or a test inside one)
        # is a conscious change: this step fails until the count below is
        # updated in the same PR. Runs via `playwright test --list`, which
        # only collects tests — no dev server, no browser, no DB — so it
        # fails fast, before the Postgres service is even needed. It fires
        # for BOTH callers (e2e.yml on every branch + ci.yml's release gate).
        # 232 = 72 spec files, single chromium project (includes the
        # passkey-passwordless, trusted-device, recovery, and FX specs from
        # the security-and-pricing cycle).
        run: |
          output=$(npx playwright test --list 2>&1)
          count=$(echo "$output" | grep -oE 'Total: [0-9]+ tests' | grep -oE '[0-9]+')
          echo "$output" | tail -3
          if [ -z "$count" ]; then
            echo "::error::Could not collect the E2E suite (playwright --list failed above)."
            exit 1
          fi
          echo "E2E suite count: $count"
          if [ "$count" != "232" ]; then
            echo "::error::E2E suite count drifted from 232 to $count. If the change is intentional, update the pinned count in this workflow in the same PR."
            exit 1
          fi
      - name: Create database schema
        run: npx prisma db push
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Seed database
        run: npm run db:seed
      - name: Verify the E2E quarantine registry is still accurate
        # Issue #7: e2e/quarantine.json lists the tests excluded from the
        # blocking gate. This fails when an entry no longer matches exactly one
        # test — i.e. when a quarantined test was renamed or actually repaired
        # and its exemption was left behind.
        run: node scripts/e2e-quarantine.mjs check
      - name: Verify seeded data yields non-zero dashboard stats
        # Fast browser-free guard against the "empty dashboard despite seeded
        # DB" bug class (seed rows missing tenantId while tenant-scoped API
        # routes filter by it). Replicates /api/dashboard's exact queries via
        # scripts/check-seeded-dashboard.ts and exits non-zero on zeros. The
        # full browser-level assertion rides the E2E suite below.
        run: npm run check:seed
      - name: Run E2E tests
        # The blocking gate runs the suite MINUS the issue #7 quarantine (20
        # tests at the time of writing), so a known-red environment case can no
        # longer hold the whole release pipeline hostage. The weekly sweep runs
        # the same suite with run-quarantined: true, so nothing here is allowed
        # to rot unnoticed.
        run: |
          if [ "${{ inputs.run-quarantined }}" = "true" ]; then
            echo "::notice::Quarantine sweep — running the FULL suite, exemptions included (issue #7)."
            npm run test:e2e
          else
            EXCLUDE=$(node scripts/e2e-quarantine.mjs grep)
            echo "::notice::Excluding the issue #7 quarantine from this run: $EXCLUDE"
            npx playwright test --grep-invert "$EXCLUDE"
          fi
        env:
          JWT_SECRET: ${{ inputs.jwt-secret }}
          NEXTAUTH_SECRET: ${{ inputs.nextauth-secret }}
          NEXTAUTH_URL: ${{ inputs.nextauth-url }}
          GOOGLE_CLIENT_ID: ${{ inputs.google-client-id }}
          GOOGLE_CLIENT_SECRET: ${{ inputs.google-client-secret }}
          # No OpenAI key is provisioned for CI, so force the AI copilot's
          # dev-mode mock reply (AI_MOCK=1). The Playwright-spawned dev
          # server inherits this env from the test process, keeping the
          # copilot deterministic in E2E without an OpenAI account.
          AI_MOCK: "1"
          # Every auth spec signs in from the SAME client IP. At the production
          # login budget (10 attempts / 120s) the specs contend for one sliding
          # window, the throttle helper sleeps ~2 minutes mid-test, and the
          # suite fails at random with a different test each run. The raised
          # budget is E2E-only — src/lib/rate-limit.ts ignores this variable
          # when NODE_ENV=production, so it can never weaken a live deployment.
          E2E_LOGIN_THROTTLE_LIMIT: "500"
          # Midtrans sandbox server key: enables the signed-webhook settlement
          # specs. Empty when the repository secret is not set — those specs
          # then skip with a visible annotation.
          MIDTRANS_SANDBOX_SERVER_KEY: ${{ secrets.midtrans-sandbox-server-key }}
      - name: Verify SecurityEvent hash chain is intact
        # Fails when the tamper-evident audit chain is broken — either a
        # content/prevHash mismatch (the 409 GET /api/security/audit/verify
        # reports) or NULL-hash rows the verify walk silently skips. Runs the
        # REAL verifyAuditChain via scripts/check-audit-chain.ts; the chain
        # reflects everything the E2E suite just did, so corruption surfaces
        # here instead of silently accumulating across runs.
        run: npm run check:audit-chain
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report${{ inputs.artifact-suffix }}
          path: playwright-report/
          retention-days: 14
      - name: Upload test results
        # Per-test error-context.md files + traces (on-first-retry) for debugging.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results${{ inputs.artifact-suffix }}
          path: test-results/
          retention-days: 14
