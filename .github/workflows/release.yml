name: Release

# Runs semantic-release AFTER CI has passed on main: analyzes conventional
# commits since the last tag, bumps the version, regenerates the CHANGELOG, tags
# the merge commit, and publishes a GitHub release. The tag list is the source of
# truth for the product version — the UI reads it (NEXT_PUBLIC_APP_VERSION, see
# src/lib/app-version.ts) instead of narrating a version of its own.
#
# Two gates protect a release (issue #7):
#   1. this workflow only fires when CI succeeded on main;
#   2. the job below then WAITS for the E2E workflow on the same commit and
#      refuses to release while it is red. The gate runs the FULL suite — the
#      old quarantine registry (e2e/quarantine.json) was emptied on 2026-09-23
#      once every entry was repaired, and the weekly sweep workflow now stands
#      guard over determinism rather than hiding known-red families.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write # push the release commit + tag
  issues: write # semantic-release comment plugin contract (unused but declared)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # two releases racing on the same ref is worse than queueing

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: conventional-changelog needs every commit since the last tag
      - uses: actions/setup-node@v4
        with:
          # semantic-release 25 requires ^22.14.0 || >=24.10.0 — Node 20
          # aborts immediately with "node version ... is required".
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Require the E2E suite to be green for this commit
        # Issue #7 asked for a main-only HARD gate: a red E2E suite must stop a
        # release rather than be ignored (it was ignored for months because the
        # gate ran inside ci.yml, where the suite was chronically red and took
        # 25 minutes). The suite now runs once (e2e.yml) and this step waits for
        # THAT run on exactly this commit, so the gate costs no extra CI time.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "Waiting for the E2E workflow on $SHA ..."
          for attempt in $(seq 1 80); do
            status=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" --jq '[.workflow_runs[] | select(.name == "E2E")] | sort_by(.run_started_at) | last | "\(.status) \(.conclusion)"' 2>/dev/null || echo missing)
            echo "attempt $attempt: E2E => $status"
            case "$status" in
              "completed success")
                echo "E2E is green for $SHA — releasing."
                exit 0 ;;
              "completed "*)
                echo "::error::E2E concluded '${status#completed }' for $SHA. The release is blocked until the suite is green; the weekly sweep workflow re-runs the full suite to catch flakes between releases."
                exit 1 ;;
              *)
                sleep 30 ;;
            esac
          done
          echo "::error::Timed out waiting for the E2E workflow on $SHA."
          exit 1
      - name: semantic-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: "release-bot"
          GIT_AUTHOR_EMAIL: "actions@users.noreply.github.com"
          GIT_COMMITTER_NAME: "release-bot"
          GIT_COMMITTER_EMAIL: "actions@users.noreply.github.com"
        run: npx semantic-release
